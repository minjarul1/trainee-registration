<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainee Registration Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { margin-bottom: 10px; }
        .header p { opacity: 0.8; }
        .form-container {
            padding: 30px;
        }
        .form-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .form-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .file-upload {
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-upload:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }
        .file-upload input {
            display: none;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Trainee Registration Form</h1>
            <p>Please fill in all required fields</p>
        </div>
        
        <form id="traineeForm" class="form-container">
            <!-- Personal Information -->
            <div class="form-section">
                <h3>👤 Personal Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name (English) *</label>
                        <input type="text" name="fullNameEn" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Full Name (Bangla)</label>
                        <input type="text" name="fullNameBn" placeholder="জন ডাও">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date of Birth *</label>
                        <input type="date" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label>National ID *</label>
                        <input type="text" name="nid" required placeholder="1234567890123">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" name="phone" required placeholder="+880 1XXX-XXXXXX">
                    </div>
                </div>
            </div>
            
            <!-- Address -->
            <div class="form-section">
                <h3>🏠 Address</h3>
                <div class="form-group">
                    <label>Permanent Address *</label>
                    <textarea name="permanentAddress" rows="3" required placeholder="Village, Post Office, Post Code, Upazila, District"></textarea>
                </div>
                <div class="form-group">
                    <label>Present Address *</label>
                    <textarea name="presentAddress" rows="3" required placeholder="Current living address"></textarea>
                </div>
            </div>
            
            <!-- Family Profile -->
            <div class="form-section">
                <h3>👨‍👩‍👦 Family Profile</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Father's Name</label>
                        <input type="text" name="fatherName" placeholder="Father's full name">
                    </div>
                    <div class="form-group">
                        <label>Mother's Name</label>
                        <input type="text" name="motherName" placeholder="Mother's full name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Father's Occupation</label>
                        <input type="text" name="fatherOccupation">
                    </div>
                    <div class="form-group">
                        <label>Annual Family Income</label>
                        <select name="income">
                            <option value="">Select range</option>
                            <option value="below_100k">Below 100,000 BDT</option>
                            <option value="100k_300k">100,000 - 300,000 BDT</option>
                            <option value="300k_500k">300,000 - 500,000 BDT</option>
                            <option value="above_500k">Above 500,000 BDT</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Education -->
            <div class="form-section">
                <h3>📚 Education</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Highest Education *</label>
                        <select name="education" required>
                            <option value="">Select</option>
                            <option value="ss">SSC</option>
                            <option value="hs">HSC</option>
                            <option value="diploma">Diploma</option>
                            <option value="bachelors">Bachelor's Degree</option>
                            <option value="masters">Master's Degree</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Institute Name</label>
                        <input type="text" name="institute" placeholder="School/College/University name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Year of Passing</label>
                        <input type="number" name="passingYear" min="1990" max="2030" placeholder="2024">
                    </div>
                    <div class="form-group">
                        <label>GPA/Grade</label>
                        <input type="text" name="grade" placeholder="5.00 or A+">
                    </div>
                </div>
            </div>
            
            <!-- Employment -->
            <div class="form-section">
                <h3>💼 Employment Status</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Employment Status *</label>
                        <select name="employmentStatus" required>
                            <option value="">Select</option>
                            <option value="student">Student</option>
                            <option value="employed">Employed</option>
                            <option value="unemployed">Unemployed</option>
                            <option value="freelancer">Freelancer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Monthly Income (if employed)</label>
                        <input type="number" name="monthlyIncome" placeholder="BDT">
                    </div>
                </div>
            </div>
            
            <!-- Document Upload -->
            <div class="form-section">
                <h3>📎 Document Upload</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Passport Photo *</label>
                        <div class="file-upload" onclick="document.getElementById('photo').click()">
                            <span id="photoLabel">Click to upload photo</span>
                            <input type="file" id="photo" name="photo" accept="image/*" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Signature *</label>
                        <div class="file-upload" onclick="document.getElementById('signature').click()">
                            <span id="signatureLabel">Click to upload signature</span>
                            <input type="file" id="signature" name="signature" accept="image/*" required>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                Submit Registration
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your application...</p>
            </div>
            
            <div class="status" id="status"></div>
        </form>
    </div>
    
    <script>
        // File upload handling
        document.getElementById('photo').addEventListener('change', function(e) {
            const label = document.getElementById('photoLabel');
            if (e.target.files[0]) {
                label.textContent = '✓ ' + e.target.files[0].name;
            }
        });
        
        document.getElementById('signature').addEventListener('change', function(e) {
            const label = document.getElementById('signatureLabel');
            if (e.target.files[0]) {
                label.textContent = '✓ ' + e.target.files[0].name;
            }
        });
        
        // Form submission
        document.getElementById('traineeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            
            // Show loading
            submitBtn.disabled = true;
            loading.classList.add('active');
            status.className = 'status';
            status.style.display = 'none';
            
            // Collect form data
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            
            try {
                // Submit to backend
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });
                
                const result = await response.json();
                
                if (result.success) {
                    status.textContent = '✅ Registration successful! Confirmation email sent.';
                    status.className = 'status success';
                    this.reset();
                    document.getElementById('photoLabel').textContent = 'Click to upload photo';
                    document.getElementById('signatureLabel').textContent = 'Click to upload signature';
                } else {
                    status.textContent = '❌ ' + (result.message || 'Submission failed');
                    status.className = 'status error';
                }
            } catch (error) {
                status.textContent = '❌ Network error: ' + error.message;
                status.className = 'status error';
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
                status.style.display = 'block';
            }
        });
    </script>
</body>
</html>
